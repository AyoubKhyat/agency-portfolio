name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A throwaway PostgreSQL that exists only for this job, for the database tests below. Test-only credentials;
    # nothing here is or can reach production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: daily_leads_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d daily_leads_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      # The Daily Lead Agent's store against the job's own PostgreSQL: round locks, simultaneous Continues, no
      # duplicate leads. The schema is generated offline from schema.prisma (no db push, no other database), and
      # the step fails if any of these tests is skipped, so a misconfiguration can't pass silently.
      - name: Daily leads DB tests (CI PostgreSQL only)
        env:
          DAILY_LEADS_TEST_DATABASE_URL: postgresql://ci:ci-only-password@127.0.0.1:5432/daily_leads_test
          PGPASSWORD: ci-only-password
        run: |
          set -euo pipefail
          npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script > "$RUNNER_TEMP/schema.sql"
          psql -h 127.0.0.1 -U ci -d daily_leads_test -v ON_ERROR_STOP=1 -q -f "$RUNNER_TEMP/schema.sql"
          node --import tsx --experimental-test-module-mocks --test --test-reporter=tap tests/daily-leads-db.test.ts | tee "$RUNNER_TEMP/db-tests.tap"
          grep -qx "# fail 0" "$RUNNER_TEMP/db-tests.tap"
          grep -qx "# skipped 0" "$RUNNER_TEMP/db-tests.tap"
      - name: Build
        run: npm run build
        env:
          # No database is needed to build; pages are rendered per request.
          JWT_SECRET: ci-only-secret-not-used-in-production-0000
      # Lint is reported but not blocking yet: the repository has 80 pre-existing React-rule errors.
      - name: Lint (informational)
        run: npm run lint
        continue-on-error: true
